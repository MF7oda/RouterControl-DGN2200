name: Build RouterControl APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Maven Central
        run: |
          curl -I --retry 3 https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/1.9.23/kotlin-stdlib-1.9.23.pom

      - name: Build Debug APK
        run: gradle :app:assembleDebug --refresh-dependencies --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RouterControl-V1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RouterControl-V1-APK
          path: RouterControl-V1.apk
          if-no-files-found: error
